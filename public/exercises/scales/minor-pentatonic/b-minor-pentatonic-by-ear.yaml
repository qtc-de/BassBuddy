bassbuddy:
  name: B Minor Pentatonic By Ear
  ordered: true
  exercises:
    - name: Random Ear Training
      mode: hear
      ordered: true
      randomNotes: 4
      description: >-
        These notes are all from the B minor pentatonic scale. It starts
        on {{note}}. Work out the rest by ear and play them back in
        order. Restart for a new random set.
      notes:
        - B
        - D
        - E
        - F#
        - A
