bassbuddy:
  name: E Minor Pentatonic Positions
  ordered: true
  exercises:
    - name: Position 1 - Scale Shape (root E)
      description: >-
        The minor pentatonic drops the 2nd and 6th from the natural minor scale — the classic bass/blues/rock scale. Position 1 covers frets 0-4. Play it in order, starting from the root (E).
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - E
        - G
        - A
        - B
        - D

    - name: Position 2 - Scale Shape (root G)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the same five notes in order, starting from G.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - G
        - A
        - B
        - D
        - E

    - name: Position 3 - Scale Shape (root A)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the same five notes in order, starting from A.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - A
        - B
        - D
        - E
        - G

    - name: Position 4 - Scale Shape (root B)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the same five notes in order, starting from B.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - B
        - D
        - E
        - G
        - A

    - name: Position 5 - Scale Shape (root D)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the same five notes in order, starting from D.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - D
        - E
        - G
        - A
        - B
