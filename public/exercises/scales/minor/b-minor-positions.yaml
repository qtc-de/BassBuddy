bassbuddy:
  name: B Minor Scale Positions
  ordered: true
  exercises:
    - name: Position 1 - Scale Shape (root B)
      description: >-
        Position 1 covers frets 1-5. Play the B natural minor scale in order, starting from the root (B).
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - B
        - C#
        - D
        - E
        - F#
        - G
        - A

    - name: Position 2 - Scale Shape (root C#)
      description: >-
        Same frets (1-5) as Position 1 — only the starting note changes. Play the scale in order, starting from its 2nd degree (C#) instead of the root.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - C#
        - D
        - E
        - F#
        - G
        - A
        - B

    - name: Position 3 - Scale Shape (root D)
      description: >-
        Same frets (1-5) as Position 1 — only the starting note changes. Play the scale in order, starting from its 3rd degree (D) instead of the root.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - D
        - E
        - F#
        - G
        - A
        - B
        - C#

    - name: Position 4 - Scale Shape (root E)
      description: >-
        Same frets (1-5) as Position 1 — only the starting note changes. Play the scale in order, starting from its 4th degree (E) instead of the root.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - E
        - F#
        - G
        - A
        - B
        - C#
        - D

    - name: Position 5 - Scale Shape (root F#)
      description: >-
        Same frets (1-5) as Position 1 — only the starting note changes. Play the scale in order, starting from its 5th degree (F#) instead of the root.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - F#
        - G
        - A
        - B
        - C#
        - D
        - E

    - name: Position 6 - Scale Shape (root G)
      description: >-
        Same frets (1-5) as Position 1 — only the starting note changes. Play the scale in order, starting from its 6th degree (G) instead of the root.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
