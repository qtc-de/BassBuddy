bassbuddy:
  name: E Minor By Ear
  ordered: true
  exercises:
    - name: Random Ear Training
      mode: hear
      ordered: true
      randomNotes: 4
      description: >-
        These notes are all from the E natural minor scale. It starts on
        {{note}}. Work out the rest by ear and play them back in order.
        Restart for a new random set.
      notes:
        - E
        - F#
        - G
        - A
        - B
        - C
        - D
