bassbuddy:
  name: B Minor Arpeggios
  ordered: true
  exercises:
    - name: Position 1 - i Arpeggio (B minor)
      description: >-
        This position's diatonic arpeggio, built on the root, is B minor
        (i): B - D - F#. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - B
        - D
        - F#

    - name: Position 1 - i7 Arpeggio (Bm7)
      description: >-
        Extend it to a seventh chord: Bm7 (i7):
        B - D - F# - A. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - B
        - D
        - F#
        - A

    - name: Position 2 - ii° Arpeggio (C# diminished)
      description: >-
        This position's diatonic arpeggio is C# diminished
        (ii°): C# - E - G. Unlike the others, both thirds stacked here are minor thirds, which is what makes a diminished chord. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - C#
        - E
        - G

    - name: Position 2 - ii° Arpeggio (C#m7♭5)
      description: >-
        Extend it to a seventh chord: C#m7♭5 (ii°7 (half-diminished)):
        C# - E - G - B. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - C#
        - E
        - G
        - B

    - name: Position 3 - III Arpeggio (D major)
      description: >-
        This position's diatonic arpeggio is D major
        (III): D - F# - A. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - D
        - F#
        - A

    - name: Position 3 - IIImaj7 Arpeggio (Dmaj7)
      description: >-
        Extend it to a seventh chord: Dmaj7 (IIImaj7):
        D - F# - A - C#. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - D
        - F#
        - A
        - C#

    - name: Position 4 - iv Arpeggio (E minor)
      description: >-
        This position's diatonic arpeggio is E minor
        (iv): E - G - B. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - E
        - G
        - B

    - name: Position 4 - iv7 Arpeggio (Em7)
      description: >-
        Extend it to a seventh chord: Em7 (iv7):
        E - G - B - D. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - E
        - G
        - B
        - D

    - name: Position 5 - v Arpeggio (F# minor)
      description: >-
        This position's diatonic arpeggio is F# minor
        (v): F# - A - C#. In natural minor this stays minor (it's only major/dominant in harmonic minor). Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - F#
        - A
        - C#

    - name: Position 5 - v7 Arpeggio (F#m7)
      description: >-
        Extend it to a seventh chord: F#m7 (v7):
        F# - A - C# - E. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - F#
        - A
        - C#
        - E

    - name: Position 6 - VI Arpeggio (G major)
      description: >-
        This position's diatonic arpeggio is G major
        (VI): G - B - D. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - G
        - B
        - D

    - name: Position 6 - VImaj7 Arpeggio (Gmaj7)
      description: >-
        Extend it to a seventh chord: Gmaj7 (VImaj7):
        G - B - D - F#. Play it in order.
      fretboard:
        start: 1
        end: 5
      ordered: true
      notes:
        - G
        - B
        - D
        - F#
