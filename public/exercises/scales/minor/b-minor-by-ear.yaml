bassbuddy:
  name: B Minor By Ear
  ordered: true
  exercises:
    - name: Ear Training 1
      mode: hear
      description: >-
        These notes are all from the B natural minor scale. It starts on
        B. Work out the rest by ear and play them back in order.
      ordered: true
      notes:
        - B
        - C#
        - D
        - G

