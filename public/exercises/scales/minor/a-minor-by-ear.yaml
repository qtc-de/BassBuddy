bassbuddy:
  name: A Minor By Ear
  ordered: true
  exercises:
    - name: Ear Training 1
      mode: hear
      description: >-
        These notes are all from the A natural minor scale. It starts on
        A. Work out the rest by ear and play them back in order.
      ordered: true
      notes:
        - A
        - E
        - C
        - A

