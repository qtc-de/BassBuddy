bassbuddy:
  name: D Major Scale Positions
  ordered: true
  exercises:
    - name: Position 1 - Scale Shape (root D)
      description: >-
        Position 1 covers frets 0-4. Play the D major scale in order, starting from the root (D).
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - D
        - E
        - F#
        - G
        - A
        - B
        - C#

    - name: Position 2 - Scale Shape (root E)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the scale in order, starting from its 2nd degree (E) instead of the root.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - E
        - F#
        - G
        - A
        - B
        - C#
        - D

    - name: Position 3 - Scale Shape (root F#)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the scale in order, starting from its 3rd degree (F#) instead of the root.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - F#
        - G
        - A
        - B
        - C#
        - D
        - E

    - name: Position 4 - Scale Shape (root G)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the scale in order, starting from its 4th degree (G) instead of the root.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - G
        - A
        - B
        - C#
        - D
        - E
        - F#

    - name: Position 5 - Scale Shape (root A)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the scale in order, starting from its 5th degree (A) instead of the root.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - A
        - B
        - C#
        - D
        - E
        - F#
        - G

    - name: Position 6 - Scale Shape (root B)
      description: >-
        Same frets (0-4) as Position 1 — only the starting note changes. Play the scale in order, starting from its 6th degree (B) instead of the root.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - B
        - C#
        - D
        - E
        - F#
        - G
        - A
