        - F#
        - A
        - C#

    - name: Position 3 - iii7 Arpeggio (F#m7)
      description: >-
        Extend it to a seventh chord: F#m7 (iii7):
        F# - A - C# - E. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - F#
        - A
        - C#
        - E

    - name: Position 4 - IV Arpeggio (G major)
      description: >-
        This position's diatonic arpeggio is G major
