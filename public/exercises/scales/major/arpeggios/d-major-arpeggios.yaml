bassbuddy:
  name: D Major Arpeggios
  ordered: true
  exercises:
    - name: Position 1 - I Arpeggio (D major)
      description: >-
        This position's diatonic arpeggio, built on the root, is D major
        (I): D - F# - A. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - D
        - F#
        - A

    - name: Position 1 - Imaj7 Arpeggio (Dmaj7)
      description: >-
        Extend it to a seventh chord: Dmaj7 (Imaj7):
        D - F# - A - C#. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - D
        - F#
        - A
        - C#

    - name: Position 2 - ii Arpeggio (E minor)
      description: >-
        This position's diatonic arpeggio is E minor
        (ii): E - G - B. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - E
        - G
        - B

    - name: Position 2 - ii7 Arpeggio (Em7)
      description: >-
        Extend it to a seventh chord: Em7 (ii7):
        E - G - B - D. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - E
        - G
        - B
        - D

    - name: Position 3 - iii Arpeggio (F# minor)
      description: >-
        This position's diatonic arpeggio is F# minor
        (iii): F# - A - C#. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
