      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - G
        - B
        - D

    - name: Position 4 - IVmaj7 Arpeggio (Gmaj7)
      description: >-
        Extend it to a seventh chord: Gmaj7 (IVmaj7):
        G - B - D - F#. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - G
        - B
        - D
        - F#

    - name: Position 5 - V Arpeggio (A major)
      description: >-
        This position's diatonic arpeggio is A major
