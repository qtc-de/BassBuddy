bassbuddy:
  name: G Major Arpeggios
  ordered: true
  exercises:
    - name: Position 1 - I Arpeggio (G major)
      description: >-
        This position's diatonic arpeggio, built on the root, is G major
        (I): G - B - D. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - G
        - B
        - D

    - name: Position 1 - Imaj7 Arpeggio (Gmaj7)
      description: >-
        Extend it to a seventh chord: Gmaj7 (Imaj7):
        G - B - D - F#. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - G
        - B
        - D
        - F#

    - name: Position 2 - ii Arpeggio (A minor)
      description: >-
        This position's diatonic arpeggio is A minor
        (ii): A - C - E. Play it in order.
      fretboard:
        start: 0
        end: 4
      ordered: true
      notes:
        - A
        - C
        - E

    - name: Position 2 - ii7 Arpeggio (Am7)
      description: >-
        Extend it to a seventh chord: Am7 (ii7):
        A - C - E - G. Play it in order.
      fretboard:
        start: 0
