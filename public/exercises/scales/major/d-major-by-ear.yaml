bassbuddy:
  name: D Major By Ear
  ordered: true
  exercises:
    - name: Ear Training 1
      mode: hear
      description: >-
        These notes are all from the D major scale. It starts on
        C#. Work out the rest by ear and play them back in order.
      ordered: true
      notes:
        - C#
        - F#
        - A
        - F#

