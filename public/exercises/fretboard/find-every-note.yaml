bassbuddy:
  name: Find Every Note
  ordered: false
  exercises:
    - name: Find every C
      description: >-
        Play every C on the neck — one point per octave of C you find. Repeating a spot you already hit doesn't count again.
      ordered: false
      success_on: 2
      accept_duplicates: false
      notes:
        - C

    - name: Find every C#
      description: >-
